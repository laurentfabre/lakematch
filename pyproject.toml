[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lakematch"
version = "0.1.0"
description = "Entity resolution for the lakehouse: one PySpark codebase for a laptop, Databricks serverless and classic compute."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Exactly three mandatory dependencies (spec/BRIEF.md, ZR-1). Everything else is an extra.
dependencies = [
    "pyspark>=4.1,<5",
    "mlflow>=3",
    "pyyaml>=6",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# A local Spark Connect session (runtime.connect: true) and the second test pass.
connect = ["pyspark[connect]>=4.1,<5"]
# Local embedding provider for organisation and title fields (model2vec static models, MIT; model picked in ZR-2).
embeddings = ["model2vec>=0.4", "pandas>=2", "pyarrow>=11"]
# The optional UDF features (Jaro-Winkler before Spark 4.3, the affine-gap alignment): pandas UDFs.
udf = ["pandas>=2", "pyarrow>=11"]
# Databricks-licensed quality engine, imported lazily by quality/dqx_adapter.py (ZR-6). Never mandatory.
dqx = ["databricks-labs-dqx"]
# The Jev labeller plug-in (labels.llm: jev, labels/jev.py): TypeSafe's SDK, a paid external API, off by default.
jev = ["typesafe-sdk>=0.7"]
# Corpus loaders for the benchmark harness and the FEBRL4 example.
bench = ["recordlinkage>=0.16"]
# The measured Splink reference rows of BENCHMARKS.md (bench/splink_reference.py). Never used by the engine.
reference = ["splink>=5"]
dev = ["pytest>=8", "pyspark[connect]>=4.1,<5", "recordlinkage>=0.16", "model2vec>=0.4"]

[project.scripts]
lakematch = "lakematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
