[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakematch"
version = "0.1.0"
description = "Portable Spark entity resolution (private, not for publication)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["pyspark==4.1.3", "mlflow>=3.0,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
connect = ["pyspark[connect]==4.1.3"]
dev = ["pytest>=8,<10", "build>=1,<2"]
bench = ["recordlinkage==0.16"]
embeddings = ["sentence-transformers>=5,<6"]

[project.scripts]
lakematch = "lakematch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/lakematch"]
