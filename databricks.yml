# Campaign-owned, triggered serverless inference. Classic remains parked at ENV.
bundle:
  name: lakematch_20260919
  deployment:
    lock:
      enabled: true

include:
  - resources/*.yml

variables:
  catalog:
    default: gdpr2_catalog
  schema:
    default: lakematch_20260919
  input_root:
    default: /Volumes/${var.catalog}/${var.schema}/artifacts/serverless_frozen
  fixture_root:
    default: /Volumes/${var.catalog}/${var.schema}/artifacts/cluster_fixture
  quality_engine:
    default: dqx
  app_enabled:
    default: "true"
  genie_enabled:
    default: "true"

sync:
  paths:
    - src
    - deployment
    - integration
  exclude:
    - deployment/assets/**
    - "**/__pycache__/**"

targets:
  serverless:
    default: true
    mode: development
    workspace:
      host: https://fevm-gdpr2.cloud.databricks.com
      root_path: /Workspace/Users/laurent.fabre@databricks.com/lakematch/20260919/bundle
  serverless_native:
    # Alternate configuration of the SAME resources/state, not another environment.
    # Deploy serially; never run both targets concurrently.
    mode: development
    workspace:
      host: https://fevm-gdpr2.cloud.databricks.com
      root_path: /Workspace/Users/laurent.fabre@databricks.com/lakematch/20260919/bundle
    variables:
      quality_engine: native
      app_enabled: "false"
      genie_enabled: "false"
