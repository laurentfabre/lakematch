# Campaign-owned, triggered serverless inference. Classic remains parked at ENV.
bundle:
  name: lakematch_20260919

include:
  - resources/*.yml

variables:
  catalog:
    default: gdpr2_catalog
  schema:
    default: lakematch_20260919
  input_root:
    default: /Volumes/gdpr2_catalog/lakematch_20260919/artifacts/serverless_frozen
  quality_engine:
    default: dqx
  app_enabled:
    default: "true"
  genie_enabled:
    default: "true"

sync:
  include:
    - src/lakematch/**
    - deployment/**
    - integration/check_dqx.py
    - integration/check_remote_cluster.py
  exclude:
    - app/**
    - data/**
    - experiments/**
    - .tools/**
    - .venv/**
    - spec/**
    - .isaac/**
    - .DS_Store

targets:
  serverless:
    default: true
    mode: development
    workspace:
      host: https://fevm-gdpr2.cloud.databricks.com
      root_path: /Workspace/Users/laurent.fabre@databricks.com/lakematch/20260919/bundle
  serverless_native:
    mode: development
    workspace:
      host: https://fevm-gdpr2.cloud.databricks.com
      root_path: /Workspace/Users/laurent.fabre@databricks.com/lakematch/20260919/bundle
    variables:
      quality_engine: native
      app_enabled: "false"
      genie_enabled: "false"
