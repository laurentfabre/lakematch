bundle:
  name: lakematch-genie
  deployment:
    lock:
      enabled: true

variables:
  warehouse_id:
    description: Existing query warehouse; owned by the workspace, not this bundle.
    default: 4aaa742e4712c3c9

sync:
  exclude: [build_space.py, serialized_space.json, space_id.txt]

resources:
  genie_spaces:
    matching:
      title: "LakeMatch — Entity Resolution (lakematch)"
      description: "Explore the lakematch entity-resolution benchmark on the synthetic FEBRL4 fixture: source records, scored candidate pairs (features, cosine, gap), and accepted matches with model probability. Answers match-quality, link-rate, and record-lookup questions over gdpr2_catalog.lakematch_20260919."
      parent_path: /Users/laurent.fabre@databricks.com/genie_spaces
      warehouse_id: ${var.warehouse_id}
      file_path: ./lakematch.geniespace.json
      lifecycle:
        prevent_destroy: true

targets:
  dev:
    default: true
    # Leave mode unset to preserve the existing title without a development prefix.
    workspace:
      host: https://fevm-gdpr2.cloud.databricks.com
      root_path: /Workspace/Users/laurent.fabre@databricks.com/lakematch/20260919/genie-bundle
