# Reference question (evaluation set: sent to the space as a benchmark, never as an example).
# expected: every table must appear in the generated SQL, every aggregate function must be called,
# every `mentions` regex must match (case-insensitive).
id: q02_big_merges
question: How many merges in the last run produced entities of more than 5 records?
expected:
  tables:
  - lm_crosswalk
  aggregates:
  - COUNT
  mentions:
  - mdm_id
  - '>\s*5|>=\s*6'
reference_sql: |
  SELECT COUNT(*) AS entities_over_5 FROM (
    SELECT mdm_id FROM workspace.lakematch.lm_crosswalk GROUP BY mdm_id HAVING COUNT(*) > 5)
