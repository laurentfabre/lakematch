# Modified for lakematch on 2026-09-20 from the APX 0.3.8 scaffold.
[project]
name = "lakematch-review"
dynamic = ["version"]
description = "APX entity review with durable label provenance and training snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ty>=0.0.12",
]

[tool.apx.metadata]
app-name = "lakematch-review"
app-slug = "lakematch_review"
app-entrypoint = "lakematch_review.backend.app:app"
api-prefix = "/api"
metadata-path = "src/lakematch_review/_metadata.py"

[tool.apx.ui]
root = "src/lakematch_review/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/lakematch_review/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/lakematch_review/__dist__", "src/lakematch_review/_metadata.py"]
exclude = ["src/lakematch_review/ui"]

[tool.ty.src]
include = ["src", "tests"]

[tool.hatch.build.targets.wheel.force-include]
"APX-LICENSE.txt" = "lakematch_review/APX-LICENSE.txt"
"APX-NOTICE.md" = "lakematch_review/APX-NOTICE.md"
"NOTICE" = "lakematch_review/NOTICE"
