# The arbitration app as a Databricks App (ZR-7) — its own bundle, separate from the engine's (../databricks.yml):
# APX carries the Databricks License, so app/ is a sub-project the Apache-2.0 engine never imports.
#
#   scripts/deploy.sh            checks paid_features.app in the engine config, builds, deploys, starts, grants
#
# Free Edition: three apps per account, app compute bills while the app runs, an app stops after 24 h. Stop it when
# you are done: databricks apps stop lakematch --profile fourth-pat
bundle:
  name: lakematch-app

sync:
  include:
    - .build

# no `artifacts` build here: scripts/deploy.sh runs `apx build` and then sets the paid switches in .build/app.yml;
# a bundle-side build would regenerate .build/ and silently drop them.

variables:
  warehouse_id:
    description: the SQL warehouse the app reads and writes through (fourth-pat's only warehouse on Free Edition)
    default: 79dfcc5bc7019dd3
  genie_space_id:
    description: the lakematch Genie agent (genie/space.py; bench/results/genie_space.json), set by scripts/deploy.sh

resources:
  apps:
    lakematch:
      name: lakematch
      description: "lakematch arbitration: review queue, keyboard-first labels with provenance, run statistics"
      source_code_path: ./.build
      # user authorization: the app calls Genie (and its SQL) with the signed-in user's token, never its own
      user_api_scopes: [dashboards.genie, sql]
      resources:
        - name: sql-warehouse
          description: queue, run history and Delta label store in workspace.lakematch
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          description: the lakematch Genie agent the Genie panel asks (only when paid_features.genie is on)
          genie_space:
            name: lakematch
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  dev:
    mode: production
    default: true
    workspace:
      profile: fourth-pat
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
